name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install codecs
        run: brew install ffmpeg webp zstd xz brotli
      - name: Build
        run: swift build -c release
      - name: Test
        run: swift test
      - name: Package app
        run: ./scripts/build-app.sh
      - name: End-to-end (CLI)
        run: ./scripts/e2e.sh --cli
      - uses: actions/upload-artifact@v4
        with:
          name: Dropster.app
          path: build/Dropster.app
